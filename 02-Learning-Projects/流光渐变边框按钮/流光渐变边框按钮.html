<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>流光渐变边框按钮</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    a {
      text-decoration: none;
      color: #fff;
    }

    body {
      background-color: #181d27;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* 方式一 */
    .btn1 {
      position: relative;
      display: block;
      overflow: hidden;
      width: 140px;
      height: 60px;
      padding: 3px;
      margin: 100px;
      border-radius: 6px;
      text-align: center;
      line-height: 60px;
      background-color: pink;
    }

    .btn1::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 200%;
      height: 100%;
      background: linear-gradient(115deg, #00c6ff, #0072ff, #7b2ffd, #00c6ff);
      background-size: 50% 100%;
      animation: move 0.75s linear infinite;
    }
    .btn1 span {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
      background-color: #000;
      border-radius: 6px;
    }

    @keyframes move {
      to {
        transform: translateX(-50%);
      }
    }

    .btn2 {
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      width: 300px;
      height: 200px;
      border: 1px solid #333;
      border-radius: 10px;
      margin: 50px;
      color: #fff;
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      line-height: 200px;
    }
  </style>
</head>

<body>
  <a href="#" class="btn1">
    <span>开始按钮</span>
  </a>

  <div class="btn2">渐变按钮</div>
</body>

</html>
