<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D鼠标悬停相册</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: #1e1e2e;
      }

      .box {
        margin: 200px auto;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .box .item {
        width: 120px;
        height: 120px;
        margin: 0 2px;
        cursor: pointer;
        /* 添加倒影 */
        -webkit-box-reflect: below 1px linear-gradient(transparent, #0002);
        transition: all 1.5s ease-in-out;
      }

      .box .item img {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 5px;
        object-fit: cover;
      }

      /* 核心代码 */
      /* 鼠标经过某个盒子，当前盒子变大 */
      .box .item:hover {
        /* transform: scale(3); */
        width: 360px;
        height: 360px;
        z-index: 1;
      }

      /* 鼠标经过某个盒子，其余的子盒子都变形 */
      .box:hover .item:not(:hover) {
        transform: perspective(500px) scale(0.9) rotateY(45deg);
      }

      /* 鼠标经过的盒子，后面的兄弟（姐妹） 修改下变形 */
      .box .item:hover ~ .item {
        transform: perspective(500px) scale(0.9) rotateY(-45deg);
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="item"><img src="img/1.jpg" alt="" /></div>
      <div class="item"><img src="img/2.jpg" alt="" /></div>
      <div class="item"><img src="img/3.png" alt="" /></div>
      <div class="item"><img src="img/4.jpg" alt="" /></div>
      <div class="item"><img src="img/5.jpg" alt="" /></div>
    </div>
  </body>
</html>
