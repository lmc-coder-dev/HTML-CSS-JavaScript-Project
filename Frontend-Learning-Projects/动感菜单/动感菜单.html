<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      height: 100%;
    }

    body {
      min-height: 100%;
      margin: 0;
      background: linear-gradient(to top, #30cfd0 0%, #330867 100%);
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    .nav {
      width: 250px;
      height: 50px;
      position: fixed;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      line-height: 50px;
      background-color: #fff;
    }

    .toggle {
      width: 100%;
      cursor: pointer;
      color: #ff216d;
      padding-left: 20px;
    }

    ul {
      position: relative;
      list-style: none;
      display: flex;
      flex-direction: column;
    }

    ul li {
      height: 50px;
      padding-left: 20px;
      background-color: #fff;
      color: #333;
      cursor: pointer;
      position: relative;
      opacity: 0;
      transform: translateX(-250px);
    }

    ul li:hover {
      background-color: #f2f2f2;
    }

  </style>
</head>

<body>
  <div class="nav">
    <div class="toggle">
      菜单
    </div>
    <ul>
      <li>主页</li>
      <li>关于</li>
      <li>联系</li>
      <li>介绍</li>
      <li>售后</li>
    </ul>
  </div>
</body>

</html>
