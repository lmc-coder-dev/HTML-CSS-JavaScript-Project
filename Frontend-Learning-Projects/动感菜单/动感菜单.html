<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>动感菜单</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      height: 100%;
    }

    body {
      min-height: 100%;
      margin: 0;
      background: linear-gradient(to top, #30cfd0 0%, #330867 100%);
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    .nav {
      width: 250px;
      height: 50px;
      position: fixed;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      line-height: 50px;
      background-color: #fff;
    }

    .toggle {
      width: 100%;
      cursor: pointer;
      color: #ff216d;
      padding-left: 20px;
    }

    ul {
      position: relative;
      list-style: none;
      display: flex;
      flex-direction: column;
    }

    ul li {
      height: 50px;
      padding-left: 20px;
      background-color: #fff;
      color: #333;
      cursor: pointer;
      position: relative;
      opacity: 0;
      transform: translateX(-250px);
      transition: all 0.5s  calc(0.1s * var(--i));
      /* transition-delay: calc(0.1s * var(--i)); */
    }

    ul li:hover {
      background-color: #f2f2f2;
    }

    .nav .toggle:hover + ul li {
      transform: translateX(0);
      opacity: 1;
    }
  </style>
</head>

<body>
  <div class="nav">
    <div class="toggle">
      菜单
    </div>
    <ul>
      <li style="--i:0">主页</li>
      <li style="--i:1">关于</li>
      <li style="--i:2">联系</li>
      <li style="--i:3">介绍</li>
      <li style="--i:4">售后</li>
    </ul>
  </div>
</body>

</html>
